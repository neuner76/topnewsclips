name: Daily Ingest

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00am UTC (4:00am PDT) — morning run
    - cron: '13 16 * * *'  # 4:13pm UTC (12:13pm EDT) — midday run
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -s --max-time 180 -X GET "${{ secrets.SITE_URL }}/api/ingest/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 1)
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 2)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 3)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 4)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 5)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 6)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 7)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Batches 8–14: the QC gate (added 2026-06) tripled per-story processing
      # time, so 7 batches no longer drain the candidate queue in one run —
      # fresh stories piled up unprocessed. More batches clear the backlog so
      # current news reaches the pool. Each is a no-op if the queue is empty.
      - name: Process (batch 8)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 9)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 10)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 11)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 12)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 13)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 14)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Cleanup Old Stories
        if: always()
        run: |
          curl -s --max-time 30 -X GET "${{ secrets.SITE_URL }}/api/admin/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
