name: Daily Ingest

on:
  schedule:
    - cron: '0 8 * * *'    # 8am UTC  (3am EST)  — morning run
    - cron: '0 16 * * *'   # 4pm UTC  (11am EST) — midday run (sends email)
    - cron: '0 0 * * *'    # midnight UTC (7pm EST) — evening refresh
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -s --max-time 60 -X GET "${{ secrets.SITE_URL }}/api/ingest/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 1)
        run: |
          curl -s --max-time 120 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 2)
        if: always()
        run: |
          curl -s --max-time 120 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 3)
        if: always()
        run: |
          curl -s --max-time 120 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Generate Digest
        if: always()
        run: |
          curl -s --max-time 180 -X GET "${{ secrets.SITE_URL }}/api/admin/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Send Digest Email
        if: always() && github.event.schedule == '0 16 * * *'
        run: |
          curl -s --max-time 60 -X GET "${{ secrets.SITE_URL }}/api/admin/send-digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Cleanup Old Stories
        if: always()
        run: |
          curl -s --max-time 30 -X GET "${{ secrets.SITE_URL }}/api/admin/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
