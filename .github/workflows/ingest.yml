name: Daily Ingest

on:
  schedule:
    # Single daily ingest — it feeds the morning email. A former midday run
    # ('13 16') was removed: the digest gate is state-based, so once the morning
    # edition exists the midday run never emailed — it only re-ran the full LLM
    # ingest (classify + summarize + QC) at cost, refreshing the live site in the
    # afternoon. The watchdog still recovers a missing/inadequate morning edition.
    - cron: '40 10 * * *'  # 10:40 UTC (3:40am PDT) — morning run. Off the top of the
                           # hour on purpose: '0 11' is a peak GitHub cron slot and
                           # was being queued ~4.5h (email landed ~8:48am PDT). An odd
                           # minute typically drops the scheduling lag to minutes.
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -s --max-time 180 -X GET "${{ secrets.SITE_URL }}/api/ingest/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 1)
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 2)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 3)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 4)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 5)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 6)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 7)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      # Batches 8–14: the QC gate (added 2026-06) tripled per-story processing
      # time, so 7 batches no longer drain the candidate queue in one run —
      # fresh stories piled up unprocessed. More batches clear the backlog so
      # current news reaches the pool. Each is a no-op if the queue is empty.
      - name: Process (batch 8)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 9)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 10)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 11)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 12)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 13)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 14)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Cleanup Old Stories
        if: always()
        run: |
          curl -s --max-time 30 -X GET "${{ secrets.SITE_URL }}/api/admin/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
