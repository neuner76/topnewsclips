name: Daily Ingest

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC — fetch + process
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch + Process
        run: |
          curl -s --max-time 600 -X GET "${{ secrets.SITE_URL }}/api/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Generate Digest
        if: always()
        run: |
          curl -s --max-time 60 -X GET "${{ secrets.SITE_URL }}/api/admin/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
