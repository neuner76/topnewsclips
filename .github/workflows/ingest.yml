name: Daily Ingest

on:
  schedule:
    - cron: '30 11 * * *'  # 11:30am UTC (4:30am PDT) — morning run
    - cron: '0 16 * * *'   # 4pm UTC  (11am EST) — midday run
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -s --max-time 180 -X GET "${{ secrets.SITE_URL }}/api/ingest/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 1)
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 2)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 3)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 4)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Process (batch 5)
        if: always()
        run: |
          curl -s --max-time 300 -X GET "${{ secrets.SITE_URL }}/api/ingest/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Cleanup Old Stories
        if: always()
        run: |
          curl -s --max-time 30 -X GET "${{ secrets.SITE_URL }}/api/admin/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
