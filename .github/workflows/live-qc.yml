name: Live QC Verification

on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

jobs:
  live-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify live public pages
        run: node scripts/verify-live-qc.mjs "${{ secrets.SITE_URL || 'https://www.topnewsclips.com' }}"
