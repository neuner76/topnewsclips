name: Nightly QC Sweep

on:
  schedule:
    - cron: '0 9 * * *'   # 9:00am UTC (2:00am PDT) — overnight reconciliation sweep
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  qc-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run QC reconciliation sweep (trailing 14 days)
        run: |
          curl -s --max-time 290 -X GET "${{ secrets.SITE_URL }}/api/admin/qc-sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
